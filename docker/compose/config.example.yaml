# Development stack: full cache features, no preconfigured repositories.
state_db: /var/lib/repowatch/state.sqlite3
cache_base_url: http://127.0.0.1:8080
public_cache_url: http://127.0.0.1:18080
check_interval: 300
prefetch_bandwidth_limit: 2097152
status_server:
  bind: 0.0.0.0
  port: 8085
  # Docker forwards the host-loopback port from a bridge address.
  # This developer stack publishes status only on host 127.0.0.1.
  allow_insecure_http: true
  guest_read_only: false
  token_repo_restrictions: true
# Set a password with the Compose exec command for your stack (see docs/docker.md).
admin_password_hash: null
nginx:
  enabled: true
  listen: '8080'
  cache_dir: /var/cache/nginx/repowatch
  cache_max_size: 2g
  enable_purge: true
  enable_cache_probe: true
  enable_dedup: true
syslog_listener:
  enabled: true
  bind: 127.0.0.1
  port: 5514
# Start empty; add repositories through the dashboard or YAML.
# Examples and management workflows: docs/repositories.md.
repos: []

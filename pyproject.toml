[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repowatch"
version = "0.1.0"
description = "Active watcher + cache warmer for pacman/apt/apk/RPM-MD repositories"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.scripts]
repowatch = "repowatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repowatch = ["static/*.html"]

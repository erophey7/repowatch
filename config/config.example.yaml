# Standard installation profile. See docs/quick-start.md before activation.
# Fresh installs copy this file; upgrades preserve the existing config.yaml.
# Add only the repository families/releases your clients actually use.
# Every configured repository downloads metadata, even with a warming whitelist.
# The cache serves arbitrary client requests within these repository routes;
# warming lists only limit proactive downloads, not normal client downloads.

# These path prefixes are substituted by the installer for custom layouts.
state_db: /var/lib/repowatch/state.sqlite3
cache_base_url: http://127.0.0.1:8080
# Set this to your LAN address for useful dashboard links, e.g.
# public_cache_url: http://cache.example.lan:8080
public_cache_url: null

# Bound metadata concurrency and proactive traffic for a shared cache host.
check_interval: 900
check_concurrency: 4
prefetch_concurrency: 4
prefetch_bandwidth_limit: 10485760  # 10 MiB/s across this process's warm tasks
prefetch_bandwidth_timezone: UTC
prefetch_bandwidth_schedule: []
# Example overnight override; weekdays refer to the start of the window.
# prefetch_bandwidth_schedule:
#   - days: [mon, tue, wed, thu, fri, sat, sun]
#     start: "22:00"
#     end: "07:00"
#     limit: 52428800

# Time and row caps are enforced by the periodic cleanup cycle.
event_retention_days: 90
request_retention_days: 7
warmed_retention_days: 180
event_max_rows_per_repo: 10000
request_max_rows: 1000000
key_expiry_warning_days: 30

# Set after activation: sudo -u repowatch /usr/local/bin/repowatch set-password
# Start through an SSH tunnel, or configure HTTPS using docs/access.md.
admin_password_hash: null
status_server:
  bind: 127.0.0.1
  port: 8085
  guest_read_only: false
  token_repo_restrictions: true
  allow_insecure_http: false
  trusted_proxies: []
  metrics_allowed_networks: [127.0.0.1/32, '::1/128']
  tls_cert_path: null
  tls_key_path: null

# Full cache features. Install AND load matching nginx modules before activation:
# ngx_http_cache_purge_module and ngx_http_js_module (njs).
# Dedup needs no extra module. Missing modules are errors, not silent downgrades.
# The root-owned installation policy controls cache/log paths, not this YAML.
nginx:
  enabled: true
  listen: '8080'
  server_name: repo-cache.local
  resolvers: [1.1.1.1, 9.9.9.9]  # replace with reachable LAN DNS if required
  cache_max_size: 100g            # disk budget, not a preallocation or hard quota
  cache_key_version: ''
  index_ttl: 300
  package_ttl: 15552000
  enable_purge: true
  enable_dedup: true
  enable_cache_probe: true

syslog_listener:
  enabled: true
  bind: 127.0.0.1
  port: 1514

# All supported webhook events are selected; delivery starts only after you
# supply your own receiver URL. Never put an example credential into service.
notify_webhook_url: null
notify_after_failures: 3
notify_events:
  - repository.failing
  - repository.recovered
  - repository.changed
  - warm.started
  - warm.completed

# Add your own sources through the dashboard or YAML. No upstream is contacted
# until a repository is configured. See docs/repositories.md for both workflows,
# tested route shapes, release/architecture selection and signature setup.
repos: []
